name: Local Kind CI/CD (Dynamic Tag)

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 获取简短的 Commit SHA (7位)
      - name: Set Short SHA
        id: vars
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build Docker Image with Commit SHA
        run: |
          docker build -t uv-demo:${{ env.SHORT_SHA }} .

      - name: Load Image into Kind
        run: |
          kind load docker-image demo-app:${{ env.SHORT_SHA }} --name kind

      - name: Deploy to Kind via Helm / Kustomize / set image
        run: |
          # 方式 A：如果仍使用 raw YAML，可用 set image 动态更新镜像并触发滚动升级
          kubectl apply -f k8s/deployment.yaml
          kubectl set image deployment/demo-app demo-app=demo-app:${{ env.SHORT_SHA }}

          # 验证更新
          kubectl rollout status deployment/demo-app --timeout=60s
